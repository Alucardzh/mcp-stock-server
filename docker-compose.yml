services:
  mcp-stock:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.sihanfu.cn:15999/mcp-stock-server:latest
    container_name: mcp-stock
    ports:
      - "18881:8000"
    volumes:
      - ./data/auction:/app/data/auction
    environment:
      - TZ=Asia/Shanghai
      - FASTMCP_HTTP_HOST_ORIGIN_PROTECTION=false
      - AKPROXY_TOKEN=${AKPROXY_TOKEN:-}
      - YAHOO_PROXY=${YAHOO_PROXY:-}
      - EM_PUSH2_MIN_INTERVAL=${EM_PUSH2_MIN_INTERVAL:-1.5}
      - EM_RATE_BOARD_QUOTE=${EM_RATE_BOARD_QUOTE:-40}
      - EM_RATE_BOARDS=${EM_RATE_BOARDS:-40}
      - EM_RATE_BOARD_MEMBERS=${EM_RATE_BOARD_MEMBERS:-20}
      - EM_BOARD_LIST_TTL=${EM_BOARD_LIST_TTL:-300}
      - AUCTION_ARCHIVE_ROOT=/app/data/auction
    restart: unless-stopped
    networks:
      - stock-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  stock-network:
    driver: bridge