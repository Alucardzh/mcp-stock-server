services:
  mcp-stock:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.sihanfu.cn:15999/mcp-stock-server:latest
    container_name: mcp-stock
    ports:
      - "18881:8000"
    environment:
      - TZ=Asia/Shanghai
      - FASTMCP_HTTP_HOST_ORIGIN_PROTECTION=false
      - AKPROXY_TOKEN=${AKPROXY_TOKEN:-}
      - YAHOO_PROXY=${YAHOO_PROXY:-}
    restart: unless-stopped
    networks:
      - stock-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  stock-network:
    driver: bridge